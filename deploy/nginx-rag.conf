# 「智学纪要」nginx 站点配置
# 放置位置：服务器 /etc/nginx/conf.d/rag.conf（http 上下文自动被 conf.d 引入）
# 生效：sudo nginx -t && sudo systemctl reload nginx
#
# 架构（同一台 ECS 上已有其他项目占用 80/443/8000，RAG 全部走独立端口）：
#       用户端静态站 :8082 ← nginx ← 用户访问
#       管理端静态站 :8081 ← nginx ← 管理员访问
#       /api、/media 统一反代到本机 Django(:8080)（与本地 vite proxy 行为一致）
# 注意：阿里云控制台安全组需放行 8081 / 8082 入方向
# 不要在此文件加 gzip 指令：主 nginx.conf 已启用，重复声明会导致 nginx -t 报错

server {
    listen 8082;
    server_name _;

    # 材料上传走 /api，与后端上限对齐（录音 500MB / 视频 1GB）
    client_max_body_size 1024m;

    root /var/www/rag-user;
    index index.html;

    # Vue history 路由：静态文件不存在时回落 index.html，交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API：问答流式（SSE）依赖 proxy_buffering off，必须保留
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # 用户上传材料 / 纪要音频等媒体文件（当前由 Django serve；量大后可改为 nginx 直接 alias MEDIA_ROOT）
    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}

server {
    listen 8081;
    server_name _;

    client_max_body_size 1024m;

    root /var/www/rag-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /media/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }
}
